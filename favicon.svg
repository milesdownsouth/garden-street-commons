<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg { fill: #1a1a1a; }
        .fg { fill: #E8E8D9; }
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .fg { fill: #E8E8D9; }
      }
    </style>
  </defs>
  <rect class="bg" width="100" height="100"/>
  <circle class="fg" cx="50" cy="50" r="45" fill="none" stroke="#E8E8D9" stroke-width="8"/>
  <text x="50" y="65" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#E8E8D9" text-anchor="middle">GS</text>
</svg>
